<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作業日誌</title>
  <style>
    body {
      font-family: "Helvetica Neue", sans-serif;
      margin: 1em;
      background-color: #f0f0f0;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 1em;
    }

    .entry {
      background-color: #fff;
      padding: 1em;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: auto;
    }

    label {
      display: block;
      margin-top: 1em;
      font-weight: bold;
      color: #555;
    }

    input[type="date"],
    textarea {
      width: 100%;
      padding: 0.7em;
      margin-top: 0.5em;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 1em;
    }

    button {
      margin-top: 1.5em;
      padding: 0.7em 1.2em;
      font-size: 1em;
      background-color: #0078D4;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background-color: #005ea2;
    }

    @media (max-width: 600px) {
      body {
        margin: 0.5em;
      }

      .entry {
        padding: 1em;
      }
    }
  </style>
</head>
<body>
  <p><a href="../index.html">一覧へ戻る</a></p>
  <h1>作業日誌</h1>
  <div class="entry">
    <label for="date">📅 日付</label>
    <input type="date" id="date">

    <label for="task">🛠️ 作業内容</label>
    <textarea id="task" rows="4" placeholder="今日の作業内容を記入してください"></textarea>

    <label for="notes">📝 メモ・気づき</label>
    <textarea id="notes" rows="3" placeholder="気づいたことや改善点など"></textarea>

    <button onclick="saveEntry()">保存</button>
  </div>

  <script>
    function saveEntry() {
      const date = document.getElementById('date').value;
      const task = document.getElementById('task').value;
      const notes = document.getElementById('notes').value;

      if (!date || !task) {
        alert('日付と作業内容は必須です');
        return;
      }

      const entry = {
        date,
        task,
        notes
      };

      localStorage.setItem(`entry-${date}`, JSON.stringify(entry));
      alert('保存しました！');
    }
  </script>
</body>
</html>
