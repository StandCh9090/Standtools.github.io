<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコード生成ツール</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- QR Code Library (qrcodejs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar and smooth transitions */
        * {
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen text-slate-100 flex flex-col items-center justify-center p-4 sm:p-6">

    <div class="w-full max-w-4xl bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-12">
        
        <!-- Left Panel: Controls & Input -->
        <div class="md:col-span-7 p-6 sm:p-8 flex flex-col justify-between border-b md:border-b-0 md:border-r border-slate-800">
            <div>
                <!-- Header Title -->
                <div class="flex items-center space-x-3 mb-6">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-white">QRコード ジェネレーター</h1>
                        <p class="text-xs text-slate-400">テキストやURLから瞬時にQRコードを作成</p>
                    </div>
                </div>

                <!-- Input Type Tabs / Quick Helpers -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">入力データ (URL または テキスト)</label>
                        <textarea id="qr-input" rows="4" placeholder="https://example.com または任意のテキストを入力..." class="w-full bg-slate-950/60 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none shadow-inner"></textarea>
                    </div>

                    <!-- Options Grid -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">サイズ</label>
                            <select id="qr-size" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="128">小 (128x128)</option>
                                <option value="200" selected>中 (200x200)</option>
                                <option value="300">大 (300x300)</option>
                                <option value="400">特大 (400x400)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">誤り訂正レベル</label>
                            <select id="qr-level" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="L">低 (L - 7%)</option>
                                <option value="M" selected>中 (M - 15%)</option>
                                <option value="Q">高 (Q - 25%)</option>
                                <option value="H">最高 (H - 30%)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Color customization -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">コードの色</label>
                            <div class="flex items-center space-x-2 bg-slate-950/60 border border-slate-800 rounded-xl p-2">
                                <input type="color" id="qr-color-dark" value="#000000" class="w-8 h-8 rounded border-0 cursor-pointer bg-transparent">
                                <span id="color-dark-val" class="text-xs text-slate-400 font-mono">#000000</span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">背景の色</label>
                            <div class="flex items-center space-x-2 bg-slate-950/60 border border-slate-800 rounded-xl p-2">
                                <input type="color" id="qr-color-light" value="#ffffff" class="w-8 h-8 rounded border-0 cursor-pointer bg-transparent">
                                <span id="color-light-val" class="text-xs text-slate-400 font-mono">#ffffff</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Helper Text -->
            <div class="mt-6 text-xs text-slate-500 flex items-center space-x-2">
                <svg class="w-4 h-4 text-indigo-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>入力内容は自動的にリアルタイムで反映されます。</span>
            </div>
        </div>

        <!-- Right Panel: Preview & Download -->
        <div class="md:col-span-5 p-6 sm:p-8 bg-slate-950/40 flex flex-col items-center justify-between">
            <div class="w-full flex flex-col items-center justify-center flex-grow my-4">
                <div class="relative group">
                    <!-- Glow background effect -->
                    <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-3xl blur opacity-30 group-hover:opacity-75 transition duration-500"></div>
                    
                    <!-- QR Box container -->
                    <div id="qrcode-container" class="relative bg-white p-6 rounded-2xl shadow-xl flex items-center justify-center min-h-[220px] min-w-[220px]">
                        <div id="qrcode" class="flex items-center justify-center"></div>
                        <!-- Empty State Overlay -->
                        <div id="empty-state" class="absolute inset-0 bg-white/90 rounded-2xl flex flex-col items-center justify-center p-4 text-center text-slate-500">
                            <svg class="w-10 h-10 text-slate-400 mb-2 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                            </svg>
                            <span class="text-xs font-medium text-slate-600">テキストを入力してください</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Download Buttons -->
            <div class="w-full space-y-3">
                <button id="download-btn" disabled class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-600 disabled:cursor-not-allowed text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 transition-all transform active:scale-[0.98]">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    <span>画像をダウンロード (PNG)</span>
                </button>

                <button id="copy-btn" disabled class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 disabled:bg-slate-900 disabled:text-slate-700 disabled:cursor-not-allowed text-slate-200 text-sm font-medium rounded-xl border border-slate-700/50 flex items-center justify-center space-x-2 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                    </svg>
                    <span>画像をクリップボードにコピー</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Message Box -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 border border-slate-700 text-slate-100 px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 z-50">
        <div id="toast-icon" class="text-green-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <span id="toast-msg" class="text-sm font-medium">通知メッセージ</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputField = document.getElementById('qr-input');
            const sizeSelect = document.getElementById('qr-size');
            const levelSelect = document.getElementById('qr-level');
            const colorDarkInput = document.getElementById('qr-color-dark');
            const colorLightInput = document.getElementById('qr-color-light');
            const colorDarkVal = document.getElementById('color-dark-val');
            const colorLightVal = document.getElementById('color-light-val');
            
            const qrcodeContainer = document.getElementById('qrcode');
            const emptyState = document.getElementById('empty-state');
            const downloadBtn = document.getElementById('download-btn');
            const copyBtn = document.getElementById('copy-btn');
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');

            let qrInstance = null;

            // Correct mapping for error correction levels
            const errorCorrectionMap = {
                'L': QRCode.CorrectLevel.L,
                'M': QRCode.CorrectLevel.M,
                'Q': QRCode.CorrectLevel.Q,
                'H': QRCode.CorrectLevel.H
            };

            function showToast(message, isError = false) {
                toastMsg.textContent = message;
                toast.classList.remove('translate-y-20', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 3000);
            }

            function generateQR() {
                const text = inputField.value.trim();
                const size = parseInt(sizeSelect.value);
                const level = errorCorrectionMap[levelSelect.value];
                const colorDark = colorDarkInput.value;
                const colorLight = colorLightInput.value;

                colorDarkVal.textContent = colorDark;
                colorLightVal.textContent = colorLight;

                // Clear previous qr code
                qrcodeContainer.innerHTML = '';

                if (!text) {
                    emptyState.classList.remove('hidden');
                    downloadBtn.disabled = true;
                    copyBtn.disabled = true;
                    return;
                }

                emptyState.classList.add('hidden');
                downloadBtn.disabled = false;
                copyBtn.disabled = false;

                try {
                    qrInstance = new QRCode(qrcodeContainer, {
                        text: text,
                        width: size,
                        height: size,
                        colorDark: colorDark,
                        colorLight: colorLight,
                        correctLevel: level
                    });
                } catch (e) {
                    console.error(e);
                    showToast('QRコードの生成に失敗しました', true);
                }
            }

            // Event listeners
            inputField.addEventListener('input', generateQR);
            sizeSelect.addEventListener('change', generateQR);
            levelSelect.addEventListener('change', generateQR);
            colorDarkInput.addEventListener('input', generateQR);
            colorLightInput.addEventListener('input', generateQR);

            // Download handler
            downloadBtn.addEventListener('click', () => {
                const img = qrcodeContainer.querySelector('img');
                const canvas = qrcodeContainer.querySelector('canvas');

                let dataUrl = '';
                if (canvas) {
                    dataUrl = canvas.toDataURL('image/png');
                } else if (img) {
                    dataUrl = img.src;
                }

                if (!dataUrl) {
                    showToast('ダウンロード可能な画像が見つかりません', true);
                    return;
                }

                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = `qrcode_${Date.now()}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('QRコードをダウンロードしました');
            });

            // Copy handler
            copyBtn.addEventListener('click', async () => {
                const canvas = qrcodeContainer.querySelector('canvas');
                const img = qrcodeContainer.querySelector('img');

                let dataUrl = '';
                if (canvas) {
                    dataUrl = canvas.toDataURL('image/png');
                } else if (img) {
                    dataUrl = img.src;
                }

                if (!dataUrl) {
                    showToast('コピー可能な画像が見つかりません', true);
                    return;
                }

                try {
                    const response = await fetch(dataUrl);
                    const blob = await response.blob();
                    await navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]);
                    showToast('クリップボードにコピーしました！');
                } catch (err) {
                    console.error(err);
                    showToast('コピーに失敗しました（ブラウザ制限の可能性があります）', true);
                }
            });

            // Set initial placeholder text or trigger
            inputField.value = 'https://example.com';
            generateQR();
        });
    </script>
</body>
</html>
